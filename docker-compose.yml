# Local Redis is the shared server at /home/lenny/Dev/db/redis (127.0.0.1:6379, db0).
# Do NOT start a Docker Redis on 6379 — it would conflict with that server.
#
# Start Redis:
#   pnpm redis:start
#   # or: bash /home/lenny/Dev/db/redis/start-redis.sh
#
# Optional UI (Redis Commander) against the host Redis:
version: '3.8'
services:
  redis-commander:
    image: rediscommander/redis-commander:latest
    network_mode: host
    environment:
      - REDIS_HOSTS=local:127.0.0.1:6379:0
